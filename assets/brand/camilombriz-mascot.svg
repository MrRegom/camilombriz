<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wormGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fab"/>
      <stop offset="50%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#c9184a"/>
    </linearGradient>
    <linearGradient id="wormStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff758f" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="100" cy="100" r="94" fill="#0d1612" stroke="#d2b88f" stroke-width="3" stroke-dasharray="6 3"/>
  <circle cx="100" cy="100" r="88" fill="url(#wormGlow)"/>

  <!-- Grass blades at bottom -->
  <path d="M30 170 Q45 130 55 168 Q65 125 78 170 Q92 135 105 170 Q120 128 135 168 Q150 135 165 170 Z" fill="url(#grassGrad)"/>

  <!-- Worm Body Tail & Coil -->
  <path d="M70 145 C 50 155, 45 135, 65 120 C 85 105, 95 110, 115 135 C 135 160, 165 160, 175 145 C 182 135, 175 125, 160 132 C 145 138, 125 135, 105 115 C 95 105, 85 90, 85 75 Z" fill="url(#wormGrad)" stroke="#a01438" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Worm Body Segments / Stripes -->
  <path d="M68 128 C 75 120, 85 120, 92 125" stroke="url(#wormStripe)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M95 128 C 105 138, 115 142, 128 140" stroke="url(#wormStripe)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M135 142 C 145 146, 155 144, 165 138" stroke="url(#wormStripe)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Worm Head -->
  <ellipse cx="82" cy="72" rx="28" ry="32" fill="url(#wormGrad)" stroke="#a01438" stroke-width="2.5"/>

  <!-- Cheerful big eyes -->
  <!-- Left eye -->
  <ellipse cx="74" cy="62" rx="8" ry="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <ellipse cx="75" cy="62" rx="5" ry="7" fill="#0f172a"/>
  <circle cx="73" cy="59" r="2.5" fill="#ffffff"/>
  <!-- Right eye -->
  <ellipse cx="92" cy="62" rx="8" ry="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <ellipse cx="93" cy="62" rx="5" ry="7" fill="#0f172a"/>
  <circle cx="91" cy="59" r="2.5" fill="#ffffff"/>

  <!-- Snout / Nose & Smile -->
  <ellipse cx="70" cy="76" rx="9" ry="7" fill="#ff758f"/>
  <path d="M72 82 Q82 92 90 84" fill="#991b1b" stroke="#881337" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 84 Q82 89 88 84" fill="#f43f5e"/>

  <!-- Yellow Straw Hat -->
  <!-- Brim -->
  <ellipse cx="82" cy="46" rx="36" ry="10" fill="url(#hatGrad)" stroke="#854d0e" stroke-width="2"/>
  <!-- Hat crown -->
  <path d="M58 44 C 60 22, 104 22, 106 44 Z" fill="url(#hatGrad)" stroke="#854d0e" stroke-width="2"/>
  <!-- Hat band -->
  <path d="M60 41 Q82 46 104 41" stroke="#dc2626" stroke-width="3" fill="none"/>

  <!-- Left arm giving thumbs up -->
  <path d="M60 88 Q45 92 36 86" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- White glove thumbs-up -->
  <g transform="translate(24, 72)">
    <path d="M12 18 C12 15, 14 12, 16 12 C18 12, 19 14, 19 18 L19 22 C19 25, 15 26, 12 26 C9 26, 6 24, 6 20 C6 18, 8 16, 10 16 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <!-- thumb pointing up -->
    <path d="M12 14 C12 9, 15 6, 17 6 C19 6, 20 9, 19 14 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  </g>

  <!-- Right arm on hip -->
  <path d="M106 88 Q118 96 112 108" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g transform="translate(104, 102)">
    <ellipse cx="6" cy="6" rx="5" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  </g>
</svg>
